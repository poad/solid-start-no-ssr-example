packages:
  - app
  - cdk
  - cdk/function

allowBuilds:
  '@parcel/watcher': false
  esbuild: true
  unrs-resolver: false

minimumReleaseAge: 10080 # 7 days in minutes
minimumReleaseAgeExclude:
  - pnpm@12.18.0

overrides:
  chokidar: '>=5'
  compression@<1.8.2: ^1.8.2
  glob@>=9.0.0 <=14.0.1: ^14.0.2
  h3@<1.15.9: ^1.15.9
  minimatch@>=7.0.0 <11.0.1: ^11.0.1
  semver: '>=7'

trustPolicy: no-downgrade
